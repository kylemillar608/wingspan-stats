<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wingspan Stats</title>
  <meta name="description" content="Leaderboard, player stats, Hall of Fame and game history for our Wingspan games." />
  <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151916" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
  />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Apply a saved theme before first paint to avoid a flash.
    try {
      const t = localStorage.getItem('wingspan-stats:theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script src="vendor/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#overview" aria-label="Wingspan Stats home">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="20" class="bm-bg" />
          <path class="bm-bird" d="M7 25.5c3.2-.2 5.6-1.6 7.4-4.2 2-3 4.6-5.3 8.4-5.3 2.4 0 4.2 1 5.3 2.6l4.4.9-4 1.9c-.4 5.2-4.6 9.1-10.4 9.1-3.3 0-6.2-1.3-8.1-3.4z" />
          <path class="bm-wing" d="M13.5 24.8c3.6-.1 7.2-2.2 9.6-6.2-.3 4.6-3.5 8.1-8 8.7z" />
          <circle class="bm-eye" cx="26.6" cy="18.9" r="1.2" />
        </svg>
        <span class="brand-text">Wingspan <span>Stats</span></span>
      </a>
      <nav class="tabs" aria-label="Sections">
        <a href="#overview" data-view="overview">Overview</a>
        <a href="#players" data-view="players">Players</a>
        <a href="#hall" data-view="hall">Hall of Fame</a>
        <a href="#history" data-view="history">History</a>
      </nav>
      <button class="icon-btn theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" /></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
      </button>
    </div>
  </header>

  <div id="demo-banner" hidden></div>

  <main id="main" class="container" tabindex="-1">
    <div id="status" class="status" aria-live="polite"></div>
    <div id="notices"></div>
    <div id="state"></div>
    <section id="view-overview" class="view" hidden></section>
    <section id="view-players" class="view" hidden></section>
    <section id="view-hall" class="view" hidden></section>
    <section id="view-history" class="view" hidden></section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>
        Scores come live from our <a id="sheet-link" href="#" target="_blank" rel="noopener">Google Sheet</a>.
        New games appear on refresh; Google can take up to ~5 minutes to publish edits.
      </p>
      <p class="muted">Ties: everyone tied for first gets a win. Placements use 1st, 1st, 3rd style ranking.</p>
    </div>
  </footer>
</body>
</html>
