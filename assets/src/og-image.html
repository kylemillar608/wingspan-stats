<!doctype html>
<!-- Source for assets/og-image.png (1200×630 link-preview image). Render with
     scripts/render-images.sh after editing. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@500;600&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#f4efe4;background-image:radial-gradient(rgba(120,100,60,.07) 1.2px,transparent 1.2px);background-size:22px 22px;
    font-family:Inter,system-ui,sans-serif;color:#1d2a22;display:grid;grid-template-columns:1fr 470px;gap:48px;align-items:center;padding:0 72px;box-sizing:border-box}
  .mark{width:104px;height:104px;margin-bottom:28px}
  h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:96px;line-height:.98;letter-spacing:-.025em;margin:0}
  h1 span{display:block;color:#2f5543;font-style:italic;font-weight:600}
  p{font-size:29px;color:#4a5a4f;margin:26px 0 30px;line-height:1.35}
  .players{display:flex;gap:28px;font-size:28px;font-weight:600}
  .players i{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:10px;vertical-align:1px}
  .card{background:#fffdf8;border:1.5px solid #e4dccb;border-radius:28px;box-shadow:0 2px 4px rgba(40,32,15,.05),0 18px 40px rgba(40,32,15,.08);padding:30px 30px 24px}
  .card .lab{font-size:19px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#7c867d;margin-bottom:14px}
  .awards{display:flex;gap:12px;margin-top:20px}
  .awards span{flex:1;height:62px;border-radius:16px;background:#f8f3e8;display:grid;place-items:center;font-size:32px}
</style></head><body>
<div>
  <svg class="mark" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#2f5543"/><path fill="#f7f1e3" d="M7 25.5c3.2-.2 5.6-1.6 7.4-4.2 2-3 4.6-5.3 8.4-5.3 2.4 0 4.2 1 5.3 2.6l4.4.9-4 1.9c-.4 5.2-4.6 9.1-10.4 9.1-3.3 0-6.2-1.3-8.1-3.4z"/><path fill="#d9a441" d="M13.5 24.8c3.6-.1 7.2-2.2 9.6-6.2-.3 4.6-3.5 8.1-8 8.7z"/><circle cx="26.6" cy="18.9" r="1.2" fill="#2f5543"/></svg>
  <h1>Wingspan <span>Stats</span></h1>
  <p>Leaderboard · Rivalries · Hall of Fame · Every game we’ve played</p>
  <div class="players"><span><i style="background:#2c6fb7"></i>Jen</span><span><i style="background:#d4622b"></i>Alex</span><span><i style="background:#17996f"></i>Connor</span></div>
</div>
<div class="card">
  <div class="lab">Cumulative wins</div>
  <svg viewBox="0 0 400 230" width="100%" aria-hidden="true">
    <g stroke="#e4dccb" stroke-width="1.5"><line x1="0" y1="20" x2="400" y2="20"/><line x1="0" y1="90" x2="400" y2="90"/><line x1="0" y1="160" x2="400" y2="160"/><line x1="0" y1="228" x2="400" y2="228"/></g>
    <g fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <polyline stroke="#d4622b" points="6,226 60,226 110,196 170,196 230,170 290,150 340,150 394,128"/>
      <polyline stroke="#17996f" points="6,226 60,196 110,170 170,140 230,140 290,100 340,90 394,76"/>
      <polyline stroke="#2c6fb7" points="6,226 60,226 110,196 170,160 230,120 290,84 340,52 394,24"/>
    </g>
  </svg>
  <div class="awards"><span>👑</span><span>🦅</span><span>🎭</span><span>🦤</span><span>💔</span></div>
</div>
</body></html>
